<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Java Quiz (Exact MCQ)</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.quiz-box {
    background:white;
    width:650px;
    padding:25px;
    border-radius:15px;
}

.option {
    background:#eee;
    margin:8px 0;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
}

.option:hover { background:#dcdcff; }

.correct { background:green !important; color:white; }
.wrong { background:red !important; color:white; }

button {
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    background:#667eea;
    color:white;
    border-radius:8px;
}

#result { text-align:center; margin-top:10px; }
</style>

</head>
<body>

<div class="quiz-box">
<h3 id="question"></h3>
<div id="options"></div>
<button onclick="nextQuestion()">Next</button>
<div id="result"></div>
</div>

<script>

const quiz = [

{
q:"Which of the following statements is true regarding the order of execution of constructors in an inheritance hierarchy?",
o:[
"Derived class constructor will be called followed by the base class constructor.",
"Only Base class constructor will be called.",
"Only derived class constructor will be called.",
"Base class constructor will be called followed by the derived class constructor."
],
a:3
},

{
q:"The super() method is used to:",
o:[
"Call constructor of friend class",
"Call constructor of the parent class",
"Call constructor",
"Is a declared method"
],
a:1
},

{
q:"What is the output of the following Java program?\nVehicle vehicle = new Car(); vehicle.move();",
o:[
"\"The vehicle moves\"",
"\"The car moves\"",
"The code does not compile",
"None of the above"
],
a:1
},

{
q:"Which of the following is NOT true regarding the final keyword in Java?",
o:[
"A final method cannot be overridden in a subclass.",
"A final variable can only be assigned once.",
"A final class can have subclasses.",
"A final variable can be assigned during declaration or in the constructor."
],
a:2
},

{
q:"Which type of inheritance leads to the \"Diamond Problem\"?",
o:[
"Single level",
"Multi-level",
"Multiple",
"Hierarchical"
],
a:2
},

{
q:"Members of a class which are not intended to be inherited by subclasses should be declared as:",
o:[
"Public members",
"Protected members",
"Private members",
"Private or Protected members"
],
a:2
},

{
q:"In Java, is it possible to override a static method?",
o:[
"Yes, we can override a static method just like instance methods.",
"No, static methods cannot be overridden because they belong to the class.",
"It depends if static method is final.",
"It depends on access modifier."
],
a:1
},

{
q:"What is the output of factorial program fun(5)?",
o:[
"5",
"24",
"120",
"Runtime Error"
],
a:2
},

{
q:"Which statement about abstract classes is correct?",
o:[
"Abstract classes can be instantiated directly.",
"Must contain at least one abstract method.",
"A subclass must implement abstract methods unless abstract.",
"Abstract classes can be final."
],
a:2
},

{
q:"What will happen when assigning value to final variable?",
o:[
"value of a = 20",
"error: cannot assign a value to final variable a",
"error: unknown variable",
"value of a = 40"
],
a:1
},

// Assignment 04

{
q:"Which access modifier allows access only inside the same package?",
o:[
"default",
"private",
"public",
"protected"
],
a:0
},

{
q:"Which constructor is called first when child object is created?",
o:[
"Child class constructor",
"Parent class constructor",
"Interface constructor",
"Package constructor"
],
a:1
},

{
q:"Output of Person and Employee constructor program?",
o:[
"1 Java 10 0 Java 0",
"1 Java 0 Java",
"1 Java 01 Java",
"1 java 1 0 Java 0"
],
a:2
},

{
q:"Which statement is used to use class from another package?",
o:[
"package",
"include",
"import",
"extends"
],
a:2
},

{
q:"Keyword used to define package?",
o:[
"define",
"package",
"import",
"namespace"
],
a:1
},

{
q:"How to import specific class?",
o:[
"import package.*;",
"import package.ClassName;",
"include package.ClassName;",
"use package.ClassName;"
],
a:1
},

{
q:"Output of increment programs?",
o:[
"Both become pre-increment",
"Both become post-increment",
"Both give same output",
"Operators don’t work"
],
a:2
},

{
q:"Output with protected access modifier?",
o:[
"100 Marks",
"No output",
"Compiler error",
"None"
],
a:0
},

{
q:"If no access modifier is specified?",
o:[
"private",
"protected",
"accessible only within same package",
"public"
],
a:2
},

{
q:"Most restrictive access modifier?",
o:[
"default",
"protected",
"private",
"public"
],
a:2
}

];

let current = 0;
let score = 0;

function loadQuestion() {
    document.getElementById("result").innerText="";
    let q = quiz[current];
    document.getElementById("question").innerText=(current+1)+". "+q.q;

    let optionsDiv=document.getElementById("options");
    optionsDiv.innerHTML="";

    q.o.forEach((opt,index)=>{
        let div=document.createElement("div");
        div.classList.add("option");
        div.innerText=opt;
        div.onclick=()=>checkAnswer(div,index);
        optionsDiv.appendChild(div);
    });
}

function checkAnswer(el,index){
    let correct=quiz[current].a;
    let options=document.querySelectorAll(".option");

    options.forEach(o=>o.onclick=null);

    if(index===correct){
        el.classList.add("correct");
        document.getElementById("result").innerText="✅ Correct";
        score++;
    } else {
        el.classList.add("wrong");
        options[correct].classList.add("correct");
        document.getElementById("result").innerText="❌ Wrong";
    }
}

function nextQuestion(){
    current++;
    if(current<quiz.length){
        loadQuestion();
    } else {
        document.querySelector(".quiz-box").innerHTML=
        `<h2>Score: ${score}/${quiz.length}</h2>`;
    }
}

loadQuestion();

</script>

</body>
</html>
