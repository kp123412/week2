<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Java Quiz (With Code)</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.quiz-box {
    background:white;
    width:700px;
    padding:20px;
    border-radius:15px;
    max-height:90vh;
    overflow:auto;
}

pre {
    background:#1e1e1e;
    color:#00ffcc;
    padding:10px;
    border-radius:8px;
    overflow-x:auto;
    font-size:13px;
}

.option {
    background:#eee;
    margin:8px 0;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
}

.option:hover { background:#dcdcff; }

.correct { background:green !important; color:white; }
.wrong { background:red !important; color:white; }

button {
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    background:#667eea;
    color:white;
    border-radius:8px;
}

#result { text-align:center; margin-top:10px; font-weight:bold; }
</style>

</head>
<body>

<div class="quiz-box">
<h3 id="question"></h3>
<pre id="code"></pre>
<div id="options"></div>
<button onclick="nextQuestion()">Next</button>
<div id="result"></div>
</div>

<script>

const quiz = [

{
q:"What is the output of the following Java program?",
code:`class Vehicle {
    public void move() {
        System.out.println("The vehicle moves");
    }
}
class Car extends Vehicle {
    public void move() {
        System.out.println("The car moves");
    }
}
public class Main {
    public static void main(String[] args) {
        Vehicle vehicle = new Car();
        vehicle.move();
    }
}`,
o:[
"\"The vehicle moves\"",
"\"The car moves\"",
"The code does not compile",
"None of the above"
],
a:1
},

{
q:"What is the output of the following recursive program?",
code:`public class NptelExample {
    public static int fun(int n) {
        if (n == 0) {
            return 1;
        }
        return n * fun(n - 1);
    }
    public static void main(String[] args) {
        System.out.println(fun(5));
    }
}`,
o:["5","24","120","Runtime Error"],
a:2
},

{
q:"What will happen in the following program?",
code:`class superDemoClass {
    final int a = 20;
}
class subDemoClass extends superDemoClass {
    void subFunc() {
        a = 40;
        System.out.println("value of a = " + a);
    }
}`,
o:[
"value of a = 20",
"error: cannot assign a value to final variable a",
"error: unknown variable",
"value of a = 40"
],
a:1
},

{
q:"What will be the output of the following program?",
code:`class Person {
 int a = 1;
 int b = 0;
 public Person() {
  System.out.println(a + b + " Java ");
 }
}
class Employee extends Person {
 int a = 0;
 int b = 1;
 public Employee() {
  System.out.println("" + a + b + " Java ");
 }
}
public class Question {
 public static void main(String args[]) {
  Person p = new Employee();
 }
}`,
o:[
"1 Java 10 0 Java 0",
"1 Java 0 Java",
"1 Java 01 Java",
"1 java 1 0 Java 0"
],
a:2
},

{
q:"Consider the following programs. What is correct?",
code:`// Main1.java
int number = 10;
System.out.println(number++ + ++number);

// Main2.java
int number = 10;
System.out.println(++number + number++);`,
o:[
"Both become pre-increment",
"Both become post-increment",
"Both give same output",
"Operators don’t work"
],
a:2
},

{
q:"What is the output of the following Java code?",
code:`package nptel1;
public class Teacher {
 protected void showMarks() {
  System.out.println("100 Marks");
 }
}

package nptel2;
import nptel1.*;
public class Student extends Teacher {
 void show() {
  showMarks();
 }
}`,
o:[
"100 Marks",
"No output",
"Compiler error",
"None"
],
a:0
},

// Non-code questions

{
q:"Which type of inheritance leads to the Diamond Problem?",
code:"",
o:["Single level","Multi-level","Multiple","Hierarchical"],
a:2
},

{
q:"The super() method is used to:",
code:"",
o:[
"Call constructor of friend class",
"Call constructor of the parent class",
"Call constructor",
"Is a declared method"
],
a:1
},

{
q:"Which access modifier allows access only inside same package?",
code:"",
o:["default","private","public","protected"],
a:0
},

{
q:"Which keyword defines package?",
code:"",
o:["define","package","import","namespace"],
a:1
},

{
q:"Which statement is used to import class?",
code:"",
o:["package","include","import","extends"],
a:2
},

{
q:"Which is valid Java keyword?",
code:"",
o:["number","class","include","define"],
a:1
},

{
q:"Which symbol ends Java statement?",
code:"",
o:[":",".",";"," ,"],
a:2
},

{
q:"Which method is entry point?",
code:"",
o:["init","start","main","run"],
a:2
},

{
q:"JVM purpose is:",
code:"",
o:["GUI","Platform independence","Game engine","Debugging"],
a:1
},

{
q:"Encapsulation means:",
code:"",
o:[
"Hiding implementation details",
"Creating objects",
"Multiple methods",
"Using this keyword"
],
a:0
},

{
q:"Static variable means:",
code:"",
o:["Multiple copies","Single shared copy","No copy","Error"],
a:1
},

{
q:"Constructor is used to:",
code:"",
o:["Destroy","Initialize","Print","Compile"],
a:1
},

{
q:"Java is:",
code:"",
o:["Procedural","Object oriented","Assembly","Machine"],
a:1
},

{
q:"Which is not Java feature?",
code:"",
o:[
"Platform independence",
"OOP",
"Explicit pointers",
"Polymorphism"
],
a:2
}

];

let current=0,score=0;

function loadQuestion(){
 document.getElementById("result").innerText="";
 let q=quiz[current];
 document.getElementById("question").innerText=(current+1)+". "+q.q;

 document.getElementById("code").innerText=q.code || "";

 let optionsDiv=document.getElementById("options");
 optionsDiv.innerHTML="";

 q.o.forEach((opt,i)=>{
  let div=document.createElement("div");
  div.classList.add("option");
  div.innerText=opt;
  div.onclick=()=>checkAnswer(div,i);
  optionsDiv.appendChild(div);
 });
}

function checkAnswer(el,i){
 let correct=quiz[current].a;
 let options=document.querySelectorAll(".option");

 options.forEach(o=>o.onclick=null);

 if(i===correct){
  el.classList.add("correct");
  document.getElementById("result").innerText="✅ Correct";
  score++;
 } else {
  el.classList.add("wrong");
  options[correct].classList.add("correct");
  document.getElementById("result").innerText="❌ Wrong";
 }
}

function nextQuestion(){
 current++;
 if(current<quiz.length){
  loadQuestion();
 } else {
  document.querySelector(".quiz-box").innerHTML=
  `<h2>🎉 Score: ${score}/${quiz.length}</h2>`;
 }
}

loadQuestion();

</script>

</body>
</html>
